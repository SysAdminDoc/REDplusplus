name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "!RED+.sln"

      - name: Build Release
        run: msbuild "!RED+.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Create release archive
        run: |
          mkdir release
          copy bin\Release\RED+.exe release\
          copy LICENSE release\
          xcopy help release\help\ /E /I
          xcopy language release\language\ /E /I
          Compress-Archive -Path release\* -DestinationPath "RED++_${{ inputs.version }}.zip"

      - name: Generate checksums
        shell: pwsh
        run: |
          $zip = "RED++_${{ inputs.version }}.zip"
          $lines = @(
            "{0}  {1}" -f (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower(), $zip
            "{0}  {1}" -f (Get-FileHash "release\RED+.exe" -Algorithm SHA256).Hash.ToLower(), "RED+.exe"
          )
          Set-Content -Path SHA256SUMS -Value $lines -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            RED++_${{ inputs.version }}.zip
            release/RED+.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" "RED++_${{ inputs.version }}.zip" SHA256SUMS --title "RED++ ${{ inputs.version }}" --generate-notes

      - name: VirusTotal scan
        id: virustotal
        if: env.VT_KEY != ''
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            RED++_${{ inputs.version }}.zip

      - name: Append VirusTotal link to release notes
        if: env.VT_KEY != '' && steps.virustotal.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        shell: pwsh
        run: |
          $url = ($env:ANALYSIS -split ',' | Select-Object -First 1) -replace '^[^=]+=', ''
          gh release edit "${{ inputs.version }}" --notes-append "`n**VirusTotal:** $url"

  # First submission to microsoft/winget-pkgs must be manual; this job automates
  # subsequent version bumps once the package exists upstream and WINGET_TOKEN
  # (classic PAT, public_repo scope) is configured. Skips silently otherwise.
  winget:
    needs: build
    runs-on: ubuntu-latest
    env:
      WINGET_PAT: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit winget version bump
        if: env.WINGET_PAT != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SysAdminDoc.REDplusplus
          release-tag: ${{ inputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
