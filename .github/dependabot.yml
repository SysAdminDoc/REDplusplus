version: 2
updates:
  # NuGet packages (RED+ ships none today; RED.Tests uses xUnit). Keeps the test
  # toolchain current and surfaces a transitive advisory as a PR, complementing the
  # CI vulnerability gate (which fails the build) with an automated fix.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the CI and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
