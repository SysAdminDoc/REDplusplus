name: Bug Report
description: Report a problem with RED++
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Open RED++ and set the path to ...
        2. Click Scan
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RED++ Version
      description: "Run `RED+.exe -version` or check the title bar."
      placeholder: "1.5.18"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Interface
      options:
        - GUI (default WPF shell)
        - GUI (classic WinForms via -classic)
        - CLI / headless (-silent)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version
      description: "e.g. Windows 11 24H2, Windows Server 2025"
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output / Crash Report
      description: Paste relevant lines from RED++.log or RED++.crash-*.txt if available.
      render: text
